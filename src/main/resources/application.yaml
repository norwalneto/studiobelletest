spring:
  application:
    name: studiobelle

  datasource:
    url: jdbc:postgresql://localhost:5432/studiobelle
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: change-me-in-production
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
  whatsapp:
    api-url: https://graph.facebook.com/v19.0
    access-token: ''
    phone-number-id: ''
  openai:
    api-key: ''
    model: gpt-4o-mini

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
